<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Risk AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>Patient Risk AI</h1>
    <p>Select a patient to run analysis</p>
  </div>
  <button class="build-btn" onclick="showBuildForm()">＋ Build a Patient</button>
  <div class="patient-list" id="patientList">
    <div class="list-status">Loading patients…</div>
  </div>
</aside>

<main class="main">
  <div class="main-header">
    <div class="header-row">
      <div>
        <h2 id="panelTitle">Risk Assessment</h2>
        <p class="subtitle" id="panelSubtitle">Select a patient from the list to generate a clinical risk summary.</p>
      </div>
      <div class="header-actions" id="headerActions">
        <span class="cache-indicator" id="cacheIndicator"></span>
        <button class="refresh-btn" id="refreshBtn" onclick="refreshPatient()">↺ Refresh</button>
      </div>
    </div>
  </div>
  <div class="content-area" id="contentArea">
    <div class="empty-state">
      <div class="icon">🩺</div>
      <p>No patient selected</p>
    </div>
  </div>
</main>

<script src="app.js" defer></script>
</body>
</html>
